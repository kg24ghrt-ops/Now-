name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- Auto-format on push (runs first, commits if needed) ----
  auto-format:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Auto-format code
        run: cargo fmt --all

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Rust code"
          file_pattern: "*.rs"

  # ---- Lint and check ----
  lint:
    runs-on: ubuntu-latest
    needs: auto-format
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo-deny (license/security audit)
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check advisories licenses

  # ---- Build and test (Linux) ----
  test-linux:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Run randomized runtime tests (multiple seeds)
        run: |
          for seed in $(shuf -i 1-999999 -n 5); do
            echo "Testing with seed=$seed"
            cargo test --workspace -- --test-threads=1 --seed=$seed || exit 1
          done

      - name: Run benchmarks (smoke test)
        run: cargo bench --workspace -- --test

  # ---- Build Android .so libraries ----
  build-android:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: ndk;27.0.12077973

      - name: Set NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine-android-${{ matrix.target }}

      - name: Build .so for ${{ matrix.target }}
        run: cargo ndk --target ${{ matrix.target }} --build-mode release -- build -p hw-ffi

      - name: Strip symbols (reduce size)
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            target/${{ matrix.target }}/release/libhandwriting.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhandwriting-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libhandwriting.so

  # ---- Generate C header ----
  cbindgen:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Generate header
        run: cbindgen --crate hw-ffi --output handwriting_engine.h

      - name: Upload header
        uses: actions/upload-artifact@v4
        with:
          name: handwriting_engine.h
          path: handwriting_engine.h

  # ---- Golden image regression tests ----
  golden-images:
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Generate reference images (if missing)
        run: |
          mkdir -p tests/golden-images/reference
          cargo test --workspace --test golden -- --generate-ref || true

      - name: Run golden image tests
        run: cargo test --workspace --test golden -- --nocapture

      - name: Upload reference images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-reference
          path: tests/golden-images/reference/

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/golden-images/diffs/

  # ---- Fuzz/property testing ----
  fuzz-segmentation:
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run proptest (randomized Unicode fuzzing)
        run: cargo test --workspace --test fuzz_segmentation -- --nocapture

  # ---- Release build and publish ----
  release:
    runs-on: ubuntu-latest
    needs: [test-linux, build-android, cbindgen, golden-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Android libs
        run: |
          mkdir -p android-libs/arm64-v8a
          mkdir -p android-libs/armeabi-v7a
          mkdir -p android-libs/x86_64
          cp artifacts/libhandwriting-aarch64-linux-android/libhandwriting.so android-libs/arm64-v8a/
          cp artifacts/libhandwriting-armv7-linux-androideabi/libhandwriting.so android-libs/armeabi-v7a/
          cp artifacts/libhandwriting-x86_64-linux-android/libhandwriting.so android-libs/x86_64/
          tar czf handwriting-android-libs.tar.gz android-libs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.so
            artifacts/**/*.h
            handwriting-android-libs.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
          