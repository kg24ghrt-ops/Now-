name: Build Android .so (Blazing Fast)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android]
        include:
          - target: aarch64-linux-android
            alias: arm64-v8a
          - target: armv7-linux-androideabi
            alias: armeabi-v7a
          - target: x86_64-linux-android
            alias: x86_64
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # ---------- Rust ----------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ---------- Android NDK (cached) ----------
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      # ---------- Cache Cargo ----------
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      # ---------- Install cargo-binstall (pre-built binary) ----------
      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          # or manually download:
          # curl -L -o ~/.cargo/bin/cargo-binstall https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz
          # tar -xzf - -C ~/.cargo/bin
      # Ensure it's executable
      - name: Make cargo-binstall executable
        run: chmod +x ~/.cargo/bin/cargo-binstall

      # ---------- Install cargo-ndk (pre-built) ----------
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --no-confirm

      # ---------- Build .so ----------
      - name: Build Android library
        run: cargo ndk -t ${{ matrix.alias }} build --release

      # ---------- Upload artifact ----------
      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: librs_${{ matrix.alias }}
          path: target/${{ matrix.target }}/release/librs.so