name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ============================================================
  # Format
  # ============================================================
  format:
    name: Auto-format
    runs-on: ubuntu-latest

    # Only push events can modify the repository.
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatted code
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.rs' '*.toml'
          git commit -m "style: auto-format Rust code"
          git push

  # ============================================================
  # Formatting verification
  # ============================================================
  fmt-check:
    name: Verify formatting
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

  # ============================================================
  # Clippy
  # ============================================================
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt-check

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ============================================================
  # Linux
  # ============================================================
  test-linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features

      - name: Test workspace
        run: cargo test --workspace --all-features

  # ============================================================
  # Android
  # ============================================================
  build-android:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine-android-${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865

      - name: Set Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build hw-ffi
        run: |
          cargo ndk \
            --target ${{ matrix.target }} \
            --build-mode release \
            -- build -p hw-ffi

      - name: Strip symbols
        run: |
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            "target/${{ matrix.target }}/release/libhandwriting.so"

      - name: Upload Android library
        uses: actions/upload-artifact@v4
        with:
          name: libhandwriting-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libhandwriting.so
          if-no-files-found: error

  # ============================================================
  # C header
  # ============================================================
  cbindgen:
    name: C header
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Generate header
        run: cbindgen --crate hw-ffi --output handwriting_engine.h

      - name: Upload header
        uses: actions/upload-artifact@v4
        with:
          name: handwriting-engine-header
          path: handwriting_engine.h
          if-no-files-found: error

  # ============================================================
  # Golden images
  # ============================================================
  golden-images:
    name: Golden image tests
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            mesa-vulkan-drivers

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Generate references if missing
        run: |
          mkdir -p tests/golden-images/reference
          cargo test --workspace --test golden -- --generate-ref || true

      - name: Run golden tests
        run: cargo test --workspace --test golden -- --nocapture

      - name: Upload references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-reference
          path: tests/golden-images/reference/

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/golden-images/diffs/

  # ============================================================
  # Segmentation fuzz/property tests
  # ============================================================
  fuzz-segmentation:
    name: Segmentation tests
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: handwriting-engine

      - name: Run segmentation tests
        run: cargo test --workspace --test fuzz_segmentation -- --nocapture

  # ============================================================
  # Release
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest

    needs:
      - test-linux
      - build-android
      - cbindgen
      - golden-images

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Android libraries
        uses: actions/download-artifact@v8
        with:
          pattern: libhandwriting-*
          path: artifacts

      - name: Download C header
        uses: actions/download-artifact@v8
        with:
          name: handwriting-engine-header
          path: artifacts/header

      - name: Package Android libraries
        run: |
          mkdir -p android-libs/arm64-v8a
          mkdir -p android-libs/armeabi-v7a
          mkdir -p android-libs/x86_64

          cp artifacts/libhandwriting-aarch64-linux-android/libhandwriting.so \
            android-libs/arm64-v8a/

          cp artifacts/libhandwriting-armv7-linux-androideabi/libhandwriting.so \
            android-libs/armeabi-v7a/

          cp artifacts/libhandwriting-x86_64-linux-android/libhandwriting.so \
            android-libs/x86_64/

          cp artifacts/header/handwriting_engine.h .

          tar czf handwriting-android-libs.tar.gz android-libs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.so
            handwriting_engine.h
            handwriting-android-libs.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
