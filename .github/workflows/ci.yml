name: Build Android .so (Blazing Fast)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # Strip debug symbols for significantly smaller .so file sizes on mobile
  RUSTFLAGS: "-C strip=symbols"

jobs:
  build:
    name: Build (${{ matrix.alias }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
        include:
          - target: aarch64-linux-android
            alias: arm64-v8a
          - target: armv7-linux-androideabi
            alias: armeabi-v7a
          - target: x86_64-linux-android
            alias: x86_64
          - target: i686-linux-android
            alias: x86

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          # add-to-path: true automatically exports ANDROID_NDK_HOME and ANDROID_NDK_ROOT
          add-to-path: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "android-build"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Android libraries
        # The -o flag automatically organizes output into the standard Android Studio structure
        run: cargo ndk -t ${{ matrix.alias }} -o jniLibs build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-libs-${{ matrix.alias }}
          # Automatically picks up your library regardless of its Cargo.toml name
          path: |
            jniLibs/${{ matrix.alias }}/*.so
            target/${{ matrix.target }}/release/*.a
          if-no-files-found: error