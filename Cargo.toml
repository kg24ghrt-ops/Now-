[workspace]
resolver = "2"
members = [
    "crates/hw-core",
    "crates/hw-segment",
    "crates/hw-shape",
    "crates/hw-physics",
    "crates/hw-ink",
    "crates/hw-paper",
    "crates/hw-render-wgpu",
    "crates/hw-ffi",
    "crates/script-packs/hw-script-myanmar",
    "crates/script-packs/hw-script-latin",
    "xtask",
]

[workspace.dependencies]
# Core dependencies – versions as of 2026
unicode-segmentation = "1.12"
unicode-script = "0.5"
harfrust = "0.5"          # official HarfBuzz Rust port
read-fonts = "0.26"       # fontations
kurbo = "0.11"
lyon = "1.0"
noise = "0.9"
rand = "0.8"
rand_pcg = "0.3"
palette = "0.7"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
bytemuck = { version = "1.19", features = ["derive"] }
wgpu = "24.0"
# for FFI
cbindgen = "0.28"
cargo-ndk = "3.5"
# test/bench
criterion = "0.5"
proptest = "1.4"

[profile.release]
lto = true
opt-level = 3